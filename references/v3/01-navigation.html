<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>V3 · Навигация</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <svg class="map" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
        <rect width="390" height="844" fill="#efe4d5" />

        <!-- parks / water -->
        <path d="M252 18 L390 8 L390 214 L306 236 Z" fill="#d9e0cf" />
        <path d="M-20 610 L118 574 L182 700 L44 762 Z" fill="#d9e0cf" />
        <path
          d="M-40 306 C70 262 118 356 214 330 C298 306 340 382 430 350"
          stroke="#d7e1e0"
          stroke-width="34"
          fill="none"
          stroke-linecap="round"
        />

        <!-- city blocks -->
        <g fill="#e6d7c5" stroke="#d9c6b2" stroke-width="1">
          <rect x="18" y="142" width="38" height="78" rx="2" />
          <rect x="88" y="142" width="66" height="78" rx="2" />
          <rect x="188" y="142" width="62" height="78" rx="2" />
          <rect x="288" y="142" width="52" height="78" rx="2" />
          <rect x="18" y="262" width="38" height="74" rx="2" />
          <rect x="88" y="262" width="66" height="74" rx="2" />
          <rect x="188" y="262" width="62" height="74" rx="2" />
          <rect x="288" y="262" width="52" height="74" rx="2" />
          <rect x="18" y="382" width="38" height="74" rx="2" />
          <rect x="88" y="382" width="66" height="74" rx="2" />
          <rect x="188" y="382" width="62" height="74" rx="2" />
          <rect x="288" y="382" width="52" height="74" rx="2" />
          <rect x="18" y="502" width="38" height="74" rx="2" />
          <rect x="88" y="502" width="66" height="74" rx="2" />
          <rect x="188" y="502" width="62" height="74" rx="2" />
          <rect x="288" y="502" width="52" height="74" rx="2" />
          <rect x="18" y="622" width="38" height="74" rx="2" />
          <rect x="88" y="622" width="66" height="74" rx="2" />
          <rect x="188" y="622" width="62" height="74" rx="2" />
          <rect x="288" y="622" width="52" height="74" rx="2" />
        </g>

        <!-- street outlines -->
        <g stroke="#d8c5b0" stroke-width="18" stroke-linecap="round" fill="none">
          <path d="M-20 120 L410 92" />
          <path d="M-20 240 L410 212" />
          <path d="M-20 360 L410 332" />
          <path d="M-20 480 L410 452" />
          <path d="M-20 600 L410 572" />
          <path d="M-20 720 L410 692" />
          <path d="M64 -20 L84 860" />
          <path d="M164 -20 L184 860" />
          <path d="M264 -20 L284 860" />
          <path d="M348 -20 L368 860" />
          <path d="M-20 806 L410 762" />
        </g>

        <!-- streets -->
        <g stroke="#fbf4ea" stroke-width="13" stroke-linecap="round" fill="none">
          <path d="M-20 120 L410 92" />
          <path d="M-20 240 L410 212" />
          <path d="M-20 360 L410 332" />
          <path d="M-20 480 L410 452" />
          <path d="M-20 600 L410 572" />
          <path d="M-20 720 L410 692" />
          <path d="M64 -20 L84 860" />
          <path d="M164 -20 L184 860" />
          <path d="M264 -20 L284 860" />
          <path d="M348 -20 L368 860" />
          <path d="M-20 806 L410 762" />
        </g>

        <!-- minor streets -->
        <g stroke="#f5eadc" stroke-width="6" stroke-linecap="round" fill="none">
          <path d="M-20 180 L410 152" />
          <path d="M-20 300 L410 272" />
          <path d="M-20 420 L410 392" />
          <path d="M-20 540 L410 512" />
          <path d="M-20 660 L410 632" />
          <path d="M114 -20 L134 860" />
          <path d="M214 -20 L234 860" />
          <path d="M306 -20 L326 860" />
        </g>

        <!-- map labels -->
        <g
          fill="#a78c77"
          font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif"
          font-size="9"
          letter-spacing="0.5"
        >
          <text x="196" y="236" transform="rotate(-8 196 236)">Тверская</text>
          <text x="26" y="468" transform="rotate(-8 26 468)">Кузнецкий мост</text>
          <text x="276" y="508" transform="rotate(-8 276 508)">Петровка</text>
        </g>

        <!-- route -->
        <path
          d="M92 490 C110 455 140 440 165 415 C195 385 205 365 220 340 C238 320 260 310 275 295 C286 284 294 272 300 260"
          stroke="#fff9f2"
          stroke-width="15"
          fill="none"
          stroke-linecap="round"
        />
        <path
          d="M92 490 C110 455 140 440 165 415 C195 385 205 365 220 340 C238 320 260 310 275 295 C286 284 294 272 300 260"
          stroke="#c4623f"
          stroke-width="8"
          fill="none"
          stroke-linecap="round"
        />

        <!-- location -->
        <circle cx="92" cy="490" r="24" fill="rgba(138,154,123,0.18)" />
        <circle cx="92" cy="490" r="9" fill="#8a9a7b" stroke="#fff9f2" stroke-width="4" />

        <!-- destination -->
        <path
          d="M300 234 c-13 0 -23 10 -23 23 c0 17 23 37 23 37 s23 -20 23 -37 c0 -13 -10 -23 -23 -23z"
          fill="#2e211a"
        />
        <circle cx="300" cy="257" r="7" fill="#fff9f2" />
      </svg>

      <div class="status">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
            <rect x="0" y="7" width="3" height="4" rx="1" />
            <rect x="4.5" y="5" width="3" height="6" rx="1" />
            <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
            <rect x="13.5" y="0" width="3" height="11" rx="1" />
          </svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M1.5 4.2a9.5 9.5 0 0 1 13 0" />
            <path d="M4 6.7a6 6 0 0 1 8 0" />
            <path d="M6.6 9.1a2.5 2.5 0 0 1 2.8 0" />
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".35" />
            <rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor" />
            <path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".35" />
          </svg>
        </span>
      </div>

      <div class="greeting">
        <div>
          <h1>Добрый день</h1>
          <p>Куда сегодня?</p>
        </div>
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <rect x="2" y="8" width="8" height="6" rx="2" />
            <rect x="14" y="8" width="8" height="6" rx="2" />
            <path d="M10 10.5h4" />
            <path d="M2 10L1 8M22 10l1-2" />
          </svg>
        </div>
      </div>

      <div class="search-card">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
        <span class="placeholder">Введите адрес</span>
        <span class="mic-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <path d="M12 18v3" />
          </svg>
        </span>
      </div>

      <div class="map-chips">
        <span class="chip"><span class="dot"></span>GPS · точно</span>
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="8" width="8" height="6" rx="2" />
            <rect x="14" y="8" width="8" height="6" rx="2" />
            <path d="M10 10.5h4" />
          </svg>
          Очки
        </span>
      </div>

      <div class="polaroid">
        <svg class="pixel" viewBox="0 0 72 40" preserveAspectRatio="xMidYMid meet">
          <rect width="72" height="40" rx="2" fill="#10100e" />
          <text x="4" y="7" fill="#6d8c7a" font-family="monospace" font-size="3.5">12 мин</text>
          <path d="M38 33 V23 Q38 17 32 17 H20" stroke="#9be8c8" stroke-width="4" fill="none" stroke-linecap="square" />
          <path d="M26 11 L18 17 L26 23" stroke="#9be8c8" stroke-width="4" fill="none" stroke-linecap="square" stroke-linejoin="miter" />
          <text x="43" y="22" fill="#9be8c8" font-family="monospace" font-size="10" font-weight="700">850</text>
          <text x="63" y="30" fill="#9be8c8" font-family="monospace" font-size="4">м</text>
        </svg>
        <div class="cap">Экран очков</div>
      </div>

      <div class="sheet">
        <div class="handle"></div>

        <div class="big-stats">
          <div>
            <div class="value">12 мин</div>
            <div class="label">в пути</div>
          </div>
          <div>
            <div class="value">1.4 км</div>
            <div class="label">осталось</div>
          </div>
        </div>

        <div class="maneuver-line">
          <div class="maneuver-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 21V12a6 6 0 0 0-6-6H3" />
              <path d="M7 2L3 6l4 4" />
            </svg>
          </div>
          <div>
            <div class="m-distance">850 м</div>
            <div class="m-street">налево на Тверскую</div>
          </div>
        </div>

        <button class="primary">
          В путь
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <div class="tabs">
        <div class="tab active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M9 4L3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4z" />
            <path d="M9 4v14M15 6.5v14" />
          </svg>
          <span>Карта</span>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M21 11.5a8 8 0 0 1-8 8H7l-4 3v-7a8 8 0 1 1 18-4z" />
          </svg>
          <span>Ассистент</span>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <rect x="2" y="8" width="8" height="6" rx="2" />
            <rect x="14" y="8" width="8" height="6" rx="2" />
            <path d="M10 10.5h4" />
            <path d="M2 10L1 8M22 10l1-2" />
          </svg>
          <span>Очки</span>
        </div>
      </div>

      <div class="home-indicator"></div>
    </div>
  </body>
</html>
