[project]
name = "ochko-server"
version = "0.1.0"
description = "Сервер О.Ч.К.О. для мобильного приложения: прокси к GigaChat"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
